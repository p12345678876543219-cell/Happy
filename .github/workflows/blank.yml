name: Build iOS Dylib

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
        xcodebuild -version

    - name: Compile Dylib for iOS (arm64)
      run: |
        xcrun --sdk iphoneos clang -dynamiclib -arch arm64 main.m -o executor.dylib \
          -framework UIKit \
          -framework Foundation \
          -fobjc-arc

    - name: Upload compiled Dylib
      uses: actions/upload-artifact@v4
      with:
        name: executor-dylib
        path: executor.dylib
